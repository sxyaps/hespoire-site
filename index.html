<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hespoire - Movies & Series</title>
    <meta name="description" content="Stream your favorite movies and series on Hespoire">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500,600,700,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=9">
</head>
<body>

    <!-- Auth Screen -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-box">
            <h1 class="auth-logo">HESPOIRE</h1>
            <p class="auth-subtitle">Start watching movies & series</p>
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabActivate">Activate Key</button>
                <button class="auth-tab" id="tabLogin">Sign In</button>
            </div>
            <!-- Activate: new user -->
            <form id="keyForm" class="auth-form">
                <input type="text" id="displayNameInput" placeholder="What should we call you?" autocomplete="off" required>
                <input type="text" id="licenseKey" placeholder="License key" autocomplete="off" required>
                <button type="submit" class="btn btn-primary auth-submit" id="keySubmitBtn">Activate</button>
                <p class="auth-error" id="keyError"></p>
            </form>
            <!-- Login: returning user -->
            <form id="loginForm" class="auth-form" style="display:none">
                <input type="text" id="loginPass" placeholder="License key" autocomplete="off" required>
                <button type="submit" class="btn btn-primary auth-submit" id="loginSubmitBtn">Sign In</button>
                <p class="auth-error" id="loginError"></p>
            </form>
            <p class="auth-hint">Don't have a key? <a href="#" id="buyLink" target="_blank">Get one here</a></p>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="nav-inner">
            <div class="nav-left">
                <a href="#" class="logo" data-navigate="home">HESPOIRE</a>
                <div class="nav-links">
                    <a href="#" class="nav-link active" data-navigate="home">Home</a>
                    <a href="#" class="nav-link" data-navigate="movies">Movies</a>
                    <a href="#" class="nav-link" data-navigate="series">Series</a>
                </div>
            </div>
            <div class="nav-right">
                <div class="search-wrapper" id="searchWrapper">
                    <button class="search-btn" id="searchToggle" aria-label="Search">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                    </button>
                    <input type="text" class="search-input" id="searchInput" placeholder="Search movies & series..." autocomplete="off">
                    <div class="search-dropdown" id="searchDropdown"></div>
                </div>
                <div class="user-menu" id="userMenu">
                    <span class="plan-badge" id="planBadge"></span>
                    <button class="user-btn" id="userBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        <span id="userNameDisplay"></span>
                    </button>
                    <button class="logout-btn" id="logoutBtn">Sign Out</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Mobile Nav -->
    <div class="mobile-nav">
        <a href="#" class="mobile-nav-item active" data-navigate="home">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </a>
        <a href="#" class="mobile-nav-item" data-navigate="movies">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
            <span>Movies</span>
        </a>
        <a href="#" class="mobile-nav-item" data-navigate="series">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
            <span>Series</span>
        </a>
        <a href="#" class="mobile-nav-item" data-navigate="search">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <span>Search</span>
        </a>
    </div>

    <!-- Main Content -->
    <main id="app"></main>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-sheet">
            <button class="modal-close" id="detailClose">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
            <div id="detailContent"></div>
        </div>
    </div>

    <!-- Player Overlay -->
    <div class="player-overlay" id="playerOverlay">
        <video class="player-video" id="playerVideo" playsinline></video>

        <!-- Loading -->
        <div class="player-loader" id="playerLoader">
            <div class="player-spinner-ring"></div>
            <span>Loading stream…</span>
        </div>

        <!-- Error -->
        <div class="player-err" id="playerErr">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <p id="playerErrMsg">Couldn't load the stream</p>
            <button class="btn btn-primary" onclick="CustomPlayer.retry()">Try Again</button>
        </div>

        <!-- Controls UI -->
        <div class="player-ui" id="playerUI">
            <!-- Top bar -->
            <div class="player-top-bar">
                <button class="player-back" id="playerClose">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
                    Back
                </button>
                <div class="player-title-wrap">
                    <span class="player-title" id="playerTitle"></span>
                    <span class="player-stats" id="playerStats"></span>
                </div>
                <select class="player-quality-select" id="playerQuality" style="display:none"></select>
            </div>

            <!-- Center: click-to-toggle + play button -->
            <div class="player-click-zone" id="playerClickZone"></div>
            <div class="player-center" id="playerCenter">
                <button class="pc-play" id="bigPlayBtn"></button>
            </div>

            <!-- Bottom controls (floating glass bar) -->
            <div class="player-controls">
                <div class="player-bar">
                    <div class="player-seek-wrap">
                        <div class="player-seek" id="playerSeek">
                            <div class="seek-buffered" id="seekBuffered"></div>
                            <div class="seek-played" id="seekPlayed"></div>
                            <div class="seek-thumb" id="seekThumb"></div>
                        </div>
                    </div>
                    <div class="player-btns">
                        <div class="player-btns-left">
                            <button class="p-btn" id="playPauseBtn"></button>
                            <div class="player-vol-wrap">
                                <button class="p-btn" id="muteBtn"></button>
                                <input type="range" class="player-vol" id="volRange" min="0" max="1" step="0.02" value="1">
                            </div>
                            <span class="player-time-disp" id="playerTimeDisp">0:00 / 0:00</span>
                        </div>
                        <div class="player-btns-right">
                            <button class="p-btn" id="ccBtn" title="Subtitles" style="display:none">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M7 11h2M7 14.5h4M14 11h3M14 14.5h3"/></svg>
                            </button>
                            <button class="p-btn" id="playerFsBtn"></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer" id="footer">
        <div class="footer-inner">
            <span class="footer-logo">HESPOIRE</span>
            <p class="footer-text">Stream movies & series.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
    <script src="js/app.js?v=22"></script>
</body>
</html>
